{% extends 'base.html' %}
{% block content %}
<div class="w-full flex justify-center">
    <form 
    class="lg:w-3/6 border p-5 rounded-xl "
    method="post">
        <h1 class="text-slate-700 text-4xl font-semibold mb-3">Add Course</h1>
        {% csrf_token %}
        {{ form.as_p }}
        <button
        class="p-2 flex justify-center w-full bg-slate-700 text-slate-50 rounded-md"
        type="submit">Submit</button>
    </form>
</div>
{% endblock %}
