{% extends 'base.html' %}

{% block content %}

<h1>Delete Course</h1>

<p>
    Are you sure you want to delete
    <strong>{{ course.title }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'course_details' course.id %}">
        Cancel
    </a>

</form>

{% endblock %}
