{% extends 'base.html' %}
{% block content %}
<style>

    
</style>

<div class="w-full flex justify-center">
    <form 
    method="post"

    class="grid border shadow rounded-lg p-10 lg:w-1/2">
        <h1 class="text-slate-800 text-5xl mb-2 font-semibold">Register</h1>
        {% csrf_token %}
        {{form.as_p}}
        <button
        type="submit"
        class="border bg-slate-800 p-2 text-slate-50 mt-3 rounded">Register</button>
        <a 
        href="{% url 'login' %}"
        class="mt-2">
            You already have an account ? <span class="font-semibold text-slate-8000">Login</span>
        </p>
    </form>
</div>
{% endblock %}
