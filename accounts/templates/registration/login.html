{% extends 'base.html' %}
{% block content %}
<div  class="w-full flex justify-center p-20 ">
    <form method="post"
    class="grid border shadow rounded-lg p-10 sm:w-full md:w-1/2 lg:w-1/3 ">
        {% csrf_token %}
        {{form.as_p}}
        <button
        type="submit"
        class="border bg-[#2563eb] p-2 text-blue-100 mt-3"
        >Submit</button>
    </form>
</div>
{% endblock %}
