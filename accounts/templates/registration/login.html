{% extends 'base.html' %}
{% block content %}
<div  class="w-full flex justify-center p-20 ">
    <form method="post"
    class="grid border shadow rounded-lg p-10 sm:w-full md:w-2/3 lg:w-1/2 ">
        <h1
        class="text-4xl font-semibold text-slate-800 mb-2"
        >Login</h1>
        {% csrf_token %}
        {{form.as_p}}
        <button
        type="submit"
        class="border bg-slate-800 p-2 text-slate-50 mt-3 rounded-md"
        >Submit</button>
        <a
        class="mt-2"
        href="{% url 'register' %}"
        >You dont have an accoont ?<span class="text-slate-800 font-semibold">Register</span> </a>
    </form>
</div>
{% endblock %}
