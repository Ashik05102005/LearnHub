
{% extends 'base.html' %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">

        <div class="text-center mb-8">

            <div class="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>

            <h1 class="text-2xl font-bold text-gray-800">
                Forgot Password?
            </h1>

            <p class="text-gray-500 text-sm mt-2">
                Enter your username and choose a new password.
            </p>

        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm
                    {% if message.tags == 'error' %}
                        bg-red-100 text-red-700
                    {% else %}
                        bg-green-100 text-green-700
                    {% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-5">

            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:outline-none"
                    placeholder="Enter your username"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    New Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:outline-none"
                    placeholder="Enter new password"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:outline-none"
                    placeholder="Confirm new password"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-slate-600 hover:bg-slate-700 text-white font-semibold py-3 rounded-lg transition">
                Reset Password
            </button>

        </form>

        <div class="text-center mt-6">
            <a href="{% url 'login' %}"
               class="text-slate-600 hover:text-slate-800 text-sm font-medium">
                <i class="fa-solid fa-arrow-left mr-1"></i>
                Back to Login
            </a>
        </div>

    </div>

</div>

{% endblock %}
