<!DOCTYPE html>
<html>
    <head>
        <script src="https://cdn.tailwindcss.com"></script>
        
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
    }

    .register-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    form > div {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-top: 8px;
        margin-bottom: 5px;
        color: #333;
    }

    input:not([type="file"]) {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
    }
   textarea#id_address {
    display: block !important;
    width: 100% !important;
    height: 70px !important;
    padding: 15px !important;
    box-sizing: border-box !important;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    outline: none;
}
    input:focus,
    textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
    }


    textarea {
        resize: vertical;
    }

    .helptext {
        display: none ;
    }

    .errorlist {
        color: #dc2626;
        font-size: 13px;
        /* padding-left: 20px; */
    }

    button {
        width: 100%;
        padding: 13px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }
</style>

    </head>
    <body>
        <header>
            header
        </header>
        {% block content %}

        {% endblock %}
        <footer>
            footer
        </footer>
    </body>

</html>
